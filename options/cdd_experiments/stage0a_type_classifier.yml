name: Stage0a_TypeClassifier_CDD11
model_type: Stage0TypeModel
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: cdd11_train
    type: Stage0UnifiedDataset
    mode: cdd11
    dataroot_lq: /scratch/p24cs0203/krish/datasets/CDD11/train/CDD-11_train
    categories: [low, haze, rain, snow, low_haze, low_rain, low_snow, haze_rain, haze_snow, low_haze_rain, low_haze_snow]
    degradation_types: [low, haze, rain, snow]
    scene_split_manifest: /scratch/p24cs0203/krish/stage0_cdd_split.json
    crop_size: 224
    use_hflip: true
    use_rot: true
  val:
    name: cdd11_val
    type: Stage0UnifiedDataset
    mode: cdd11
    dataroot_lq: /scratch/p24cs0203/krish/datasets/CDD11/train/CDD-11_train
    categories: [low, haze, rain, snow, low_haze, low_rain, low_snow, haze_rain, haze_snow, low_haze_rain, low_haze_snow]
    degradation_types: [low, haze, rain, snow]
    scene_split_manifest: /scratch/p24cs0203/krish/stage0_cdd_split.json
    crop_size: 224
dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 64
  pin_memory: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 64
  pin_memory: true
network_g:
  type: Stage0TypeExtractor
  num_types: 4
  widths: [64, 128, 256, 384]
path:
  experiments_root: /scratch/p24cs0203/krish/outputs/Stage0a_TypeClassifier_CDD11
  models: /scratch/p24cs0203/krish/checkpoints/Stage0a_TypeClassifier_CDD11
  training_states: /scratch/p24cs0203/krish/training_states/Stage0a_TypeClassifier_CDD11
  log: /scratch/p24cs0203/krish/outputs/Stage0a_TypeClassifier_CDD11
  visualization: /scratch/p24cs0203/krish/outputs/Stage0a_TypeClassifier_CDD11/visualization
  tb_logger: /scratch/p24cs0203/krish/tb_logger/Stage0a_TypeClassifier_CDD11
  pretrain_network_g: null
  resume_state: null
train:
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0.05}
  scheduler: {type: CosineAnnealingRestartLR, periods: [100000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 100000
  warmup_iter: -1
  type_opt: {type: TypePresenceBCELoss}
val:
  val_freq: 10000
  save_img: false
logger:
  print_freq: 100
  save_checkpoint_freq: 10000
  use_tb_logger: true
  wandb: {project: null}
