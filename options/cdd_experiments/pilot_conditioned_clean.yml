name: Pilot_E1_RowC_DirectCondition
model_type: PrecomputedConditionedTrainModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
datasets:
  train:
    name: pilot_train
    type: ConditionedRestorationDataset
    phase: train
    batch_size_per_gpu: 32
    num_worker_per_gpu: 8
    manifest: /scratch/p24cs0203/krish/conditioned_pilot/manifests/train_direct.jsonl
    condition_mode: direct
    condition_dim: 4
    gt_size: 128
    use_hflip: true
    use_rot: true
  val:
    name: pilot_val
    type: ConditionedRestorationDataset
    phase: val
    batch_size_per_gpu: 1
    num_worker_per_gpu: 4
    manifest: /scratch/p24cs0203/krish/conditioned_pilot/manifests/val_direct.jsonl
    condition_mode: direct
    condition_dim: 4
    gt_size: 128
    use_hflip: false
    use_rot: false
dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 32
  dataset_enlarge_ratio: 1
  pin_memory: true
network_g:
  type: CLIPFeedbackRefinementNAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 8
  feedback_dim: 4
  adapter_dim: 128
path:
  experiments_root: /scratch/p24cs0203/krish/outputs/Pilot_E1_RowC_DirectCondition
  models: /scratch/p24cs0203/krish/checkpoints/Pilot_E1_RowC_DirectCondition
  training_states: /scratch/p24cs0203/krish/training_states/Pilot_E1_RowC_DirectCondition
  log: /scratch/p24cs0203/krish/logs/Pilot_E1_RowC_DirectCondition
  visualization: /scratch/p24cs0203/krish/outputs/Pilot_E1_RowC_DirectCondition/visualization
  tb_logger: /scratch/p24cs0203/krish/tb_logger/Pilot_E1_RowC_DirectCondition
  pretrain_network_g: /scratch/p24cs0203/krish/checkpoints/Row_C_MultiLabel_Finetune_CDD11/net_g_latest.pth
  param_key_g: params_ema
train:
  optim_g: {type: AdamW, lr: 1.0e-4, weight_decay: 0}
  scheduler: {type: CosineAnnealingRestartLR, periods: [10000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 10000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
val:
  val_freq: 1000
  save_img: false
logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: true
  wandb: {project: null}
