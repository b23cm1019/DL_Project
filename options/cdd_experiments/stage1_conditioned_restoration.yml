name: Stage1_ConditionedRestoration_CDD11
model_type: ConditionedSRModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
datasets:
  train_1: {name: low, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/low, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_2: {name: haze, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/haze, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_3: {name: rain, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_4: {name: snow, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_5: {name: low_haze, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/low_haze, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_6: {name: low_rain, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/low_rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_7: {name: low_snow, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/low_snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_8: {name: haze_rain, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/haze_rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_9: {name: haze_snow, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/haze_snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_10: {name: low_haze_rain, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/low_haze_rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  train_11: {name: low_haze_snow, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_train/CDD-11_train/clear, dataroot_lq: /data/datasets/CDD-11_train/CDD-11_train/low_haze_snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true, dataset_enlarge_ratio: 1}
  val_1: {name: low, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_test/clear, dataroot_lq: /data/datasets/CDD-11_test/low, io_backend: {type: disk}, num_worker_per_gpu: 1, batch_size_per_gpu: 1}
  val_2: {name: haze, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_test/clear, dataroot_lq: /data/datasets/CDD-11_test/haze, io_backend: {type: disk}, num_worker_per_gpu: 1, batch_size_per_gpu: 1}
  val_3: {name: rain, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_test/clear, dataroot_lq: /data/datasets/CDD-11_test/rain, io_backend: {type: disk}, num_worker_per_gpu: 1, batch_size_per_gpu: 1}
  val_4: {name: snow, type: PairedImageDataset, dataroot_gt: /data/datasets/CDD-11_test/clear, dataroot_lq: /data/datasets/CDD-11_test/snow, io_backend: {type: disk}, num_worker_per_gpu: 1, batch_size_per_gpu: 1}
dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 32
  dataset_enlarge_ratio: 1
  pin_memory: true
network_g:
  type: FiLMConditionedNAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  num_types: 4
  num_bins: 4
  cond_dim: 128
network_extractor:
  type: OrdinalDegradationExtractor
  num_types: 4
  num_bins: 4
  widths: [64, 128, 256, 384]
path:
  experiments_root: /scratch/p24cs0203/krish/outputs/Stage1_ConditionedRestoration_CDD11
  models: /scratch/p24cs0203/krish/checkpoints/Stage1_ConditionedRestoration_CDD11
  training_states: /scratch/p24cs0203/krish/training_states/Stage1_ConditionedRestoration_CDD11
  log: /scratch/p24cs0203/krish/outputs/Stage1_ConditionedRestoration_CDD11
  visualization: /scratch/p24cs0203/krish/outputs/Stage1_ConditionedRestoration_CDD11/visualization
  tb_logger: /scratch/p24cs0203/krish/tb_logger/Stage1_ConditionedRestoration_CDD11
  # Must point to the accepted Stage 0 net_g_latest.pth before launch.
  pretrain_network_extractor: /scratch/p24cs0203/krish/checkpoints/Stage0_OrdinalExtractor/net_g_latest.pth
  param_key_extractor: params
  pretrain_network_g: null
train:
  ema_decay: 0
  optim_g: {type: AdamW, lr: 2.0e-4, weight_decay: 0, betas: [0.9, 0.99]}
  scheduler: {type: CosineAnnealingRestartLR, periods: [300000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 300000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
  idempotence_weight: 0.05
val:
  val_freq: 5000
  save_img: false
  metrics:
    psnr: {type: calculate_psnr, crop_border: 0, test_y_channel: false, image_range: 1.0}
    ssim: {type: calculate_ssim, crop_border: 0, test_y_channel: false, image_range: 1.0}
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  wandb: {project: null}
