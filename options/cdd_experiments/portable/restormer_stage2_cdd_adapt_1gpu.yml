# Stage 2 of the independent Proposed-Restormer arm.
# ONE GPU, micro-B=8 x accumulation 2 = effective B=16. Each optimizer
# update still receives 8 CDD + 8 synthetic examples, matching NAFNet Stage 2.
name: SeverityRestormer_Stage2_CDDAdapt_1gpu
model_type: SeverityExtractorAdaptationModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
find_unused_parameters: true

datasets:
  train_synthetic:
    name: synthetic_severity_replay
    type: SeverityDCPTPairedDataset
    source: synthetic
    phase: train
    manifest: @SHARED_ROOT@/severity_cdd11_lsdir_outdoor_v1/data/manifests/train.jsonl
    degradation_types: [low, haze, rain, snow]
    gt_size: 128
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1
  train_cdd:
    name: cdd11_type_adaptation
    type: SeverityDCPTPairedDataset
    source: cdd11
    phase: train
    manifest: @SHARED_ROOT@/stage0_official_r4_improved/manifests/train.jsonl
    degradation_types: [low, haze, rain, snow]
    gt_size: 128
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1
  val_synthetic:
    name: synthetic_severity_val
    type: SeverityDCPTPairedDataset
    source: synthetic
    phase: val
    manifest: @SHARED_ROOT@/severity_cdd11_lsdir_outdoor_v1/data/manifests/val.jsonl
    degradation_types: [low, haze, rain, snow]
  val_cdd:
    name: cdd11_type_val
    type: SeverityDCPTPairedDataset
    source: cdd11
    phase: val
    manifest: @SHARED_ROOT@/stage0_official_r4_improved/manifests/val.jsonl
    degradation_types: [low, haze, rain, snow]

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 8
  dataset_enlarge_ratio: 1
  sampler_type: fixed_mixed_sources
  cdd_per_batch: 4
  synthetic_per_batch: 4
  pin_memory: true
  # Avoid rebuilding eight workers and their prefetch queues at every epoch.
  persistent_workers: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: FeatureTapRestormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  scale: 1
  window_size: 8
network_extractor:
  type: FeatureSeverityExtractor
  feature_dims: [48, 96, 192]
  middle_dim: 384
  hidden_dim: 256
  num_types: 4
  num_bins: 4

# The explicit list makes the method a reusable backbone adapter: Restormer
# analysis features adapt to CDD while every decoder/restoration parameter is frozen.
analysis_parameter_prefixes: [patch_embed, encoder_level1, down1_2, encoder_level2, down2_3, encoder_level3, down3_4, latent]

path:
  experiments_root: @OUT_ROOT@/experiments/SeverityRestormer_Stage2_CDDAdapt_1gpu
  pretrain_network_g: @OUT_ROOT@/experiments/SeverityRestormer_Stage1_LSDIR80k_1gpu/models/net_g_latest.pth
  pretrain_network_extractor: @OUT_ROOT@/experiments/SeverityRestormer_Stage1_LSDIR80k_1gpu/models/net_extractor_latest.pth
  param_key_g: params
  param_key_extractor: params
  strict_load_g: true
  strict_load_extractor: true
  resume_state: null

train:
  # Two 4-CDD/4-synthetic micro-batches form one 8-CDD/8-synthetic update.
  accumulation_steps: 2
  optim_g: {type: AdamW, lr: 3.0e-5, weight_decay: 0, betas: [0.9, 0.999]}
  optim_extractor: {type: AdamW, lr: 1.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  scheduler: {type: CosineAnnealingRestartLR, periods: [50000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 50000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
  identity_loss_weight: 1.0
  replay_severity_loss_weight: 1.0
  type_loss_weight: 1.0
val: {val_freq: 50000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 25000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29632}
