# Plan B (final proposed pipeline), NAFNet, Stage 3a: head alignment.
# Trunk (intro/encoders/downs/middle_blks) frozen at the Stage-2 weights; decoder,
# FiLM (middle/decoder/skip), projector, calibrator, null condition, gate train.
# Condition = cached FULL-IMAGE logits of the frozen Stage-2 analysis copy.
# Budget: 3a 50k + 3b 700k = 750k updates (= DCPT). Batch 32, 128x128, all 13,013 images.
name: SevFull_PlanB_NAFNet_Stage3a
model_type: SeverityFullFinetuneModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
# Frozen parameters are excluded before the DDP wrap, so no unused-parameter search is needed.
find_unused_parameters: false

datasets:
  train:
    name: cdd11_full_train
    type: SeverityConditionedPairedDataset
    # Same Stage-2 NAFNet extractor as the cached logits -> reused as-is.
    manifest: @SHARED_ROOT@/severity_full/manifests/train_full.jsonl
    gt_size: 128
    use_hflip: true
    use_rot: true
  val:
    name: cdd11_test_subset
    type: SeverityConditionedPairedDataset
    manifest: @SHARED_ROOT@/severity_full/manifests/val_subset.jsonl

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 32
  dataset_enlarge_ratio: 1
  pin_memory: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: SeverityConditionedFullNAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16
  num_types: 4
  num_bins: 4
  adapter_dim: 128
  condition_mode: full
  use_gate: true
  use_calibrator: true

path:
  experiments_root: @OUT_ROOT@/experiments/SevFull_PlanB_NAFNet_Stage3a
  # Stage-2 NAFNet: identical parameter names; new modules start as identity.
  pretrain_network_g: @SHARED_ROOT@/experiments/SeverityDCPT_Stage2_CDDAdapt/models/net_g_latest.pth
  param_key_g: params
  strict_load_g: false
  resume_state: null

grad_clip: 0.01
train:
  frozen_prefixes: [intro, encoders, downs, middle_blks]
  ema_decay: 0.999
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  condition_lr_mult: 5.0    # FiLM is freshly zero-initialized here (faster condition uptake)
  encoder_lr_mult: 1.0      # unused: the encoder is frozen in 3a
  # Constant LR that supports warmup ("ConstantLR" installs no scheduler, which breaks warmup):
  # gamma 1 = never decays; the restart at 2000 resets the LR exactly to its target after warmup.
  scheduler: {type: MultiStepRestartLR, milestones: [100000000], gamma: 1.0, restarts: [0, 2000], restart_weights: [1, 1]}
  total_iter: 50000
  warmup_iter: 2000
  fft_loss_weight: 1.0
  kl_loss_weight: 0.01
  condition_dropout: 0.1
  condition_dropout_warmup: 10000
val: {val_freq: 10000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 10000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29651}
