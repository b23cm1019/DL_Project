# Plan B (final proposed pipeline), RESTORMER backbone, Stage 3a: head alignment.
# Trunk (patch_embed/encoder levels/downsamplers/latent) frozen at the Stage-2 weights; decoder,
# FiLM (middle/decoder/skip), projector, calibrator, null condition, gate train.
# Condition = cached FULL-IMAGE logits of the frozen Stage-2 analysis copy.
# Budget: 3a 50k + 3b 700k = 750k updates (= DCPT). Batch 32, 128x128, all 13,013 images.
name: SevFull_PlanB_Restormer_Stage3a
model_type: SeverityFullFinetuneModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
# Frozen parameters are excluded before the DDP wrap, so no unused-parameter search is needed.
find_unused_parameters: false

datasets:
  train:
    name: cdd11_full_train
    type: SeverityConditionedPairedDataset
    # Logits cached from the Restormer Stage-2 analysis copy (slurm/portable/cache.sh).
    manifest: @OUT_ROOT@/severity_full_restormer/manifests/train_full.jsonl
    gt_size: 128
    use_hflip: true
    use_rot: true
  val:
    name: cdd11_test_subset
    type: SeverityConditionedPairedDataset
    manifest: @OUT_ROOT@/severity_full_restormer/manifests/val_subset.jsonl

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 32
  dataset_enlarge_ratio: 1
  pin_memory: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: SeverityConditionedFullRestormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  scale: 1
  window_size: 8
  num_types: 4
  num_bins: 4
  adapter_dim: 128
  condition_mode: full
  use_gate: true
  use_calibrator: true

path:
  experiments_root: @OUT_ROOT@/experiments/SevFull_PlanB_Restormer_Stage3a
  # Stage-2 FeatureTapRestormer: identical parameter names; new modules start as identity.
  pretrain_network_g: @OUT_ROOT@/experiments/SeverityRestormer_Stage2_CDDAdapt_1gpu/models/net_g_latest.pth
  param_key_g: params
  strict_load_g: false
  resume_state: null

grad_clip: 0.01
train:
  frozen_prefixes: [patch_embed, encoder_level1, down1_2, encoder_level2, down2_3, encoder_level3, down3_4, latent]
  ema_decay: 0.999
  encoder_prefixes: [patch_embed, encoder_level1, down1_2, encoder_level2, down2_3, encoder_level3, down3_4, latent]
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  condition_lr_mult: 5.0    # FiLM is freshly zero-initialized here (faster condition uptake)
  encoder_lr_mult: 1.0      # unused: the encoder is frozen in 3a
  # Constant LR that supports warmup ("ConstantLR" installs no scheduler, which breaks warmup):
  # gamma 1 = never decays; the restart at 2000 resets the LR exactly to its target after warmup.
  scheduler: {type: MultiStepRestartLR, milestones: [100000000], gamma: 1.0, restarts: [0, 2000], restart_weights: [1, 1]}
  total_iter: 50000
  warmup_iter: 2000
  fft_loss_weight: 1.0
  kl_loss_weight: 0.01
  condition_dropout: 0.1
  condition_dropout_warmup: 10000
val: {val_freq: 10000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 10000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29661}
