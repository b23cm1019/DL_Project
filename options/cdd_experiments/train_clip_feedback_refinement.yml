name: CLIP_Feedback_Refinement_RowC
model_type: CLIPFeedbackRefinementTrainModel
num_gpu: 1
manual_seed: 0
datasets:
  train: {name: refinement_train, type: RefinementFeedbackDataset, manifest: /scratch/p24cs0203/krish/refinement_poc/manifests/train_clip.jsonl, feedback_mode: clip, gt_size: 128, use_hflip: true, use_rot: true, batch_size_per_gpu: 32, num_worker_per_gpu: 8, pin_memory: true}
  val: {name: refinement_val, type: RefinementFeedbackDataset, manifest: /scratch/p24cs0203/krish/refinement_poc/manifests/val_clip.jsonl, feedback_mode: clip, batch_size_per_gpu: 1, num_worker_per_gpu: 4, pin_memory: true}
dataloader: {phase: train, use_shuffle: true, num_worker_per_gpu: 8, batch_size_per_gpu: 32, dataset_enlarge_ratio: 1, pin_memory: true}
network_g:
  type: CLIPFeedbackRefinementNAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  feedback_dim: 16
  adapter_dim: 128
path:
  experiments_root: /scratch/p24cs0203/krish/outputs/CLIP_Feedback_Refinement_RowC
  models: /scratch/p24cs0203/krish/checkpoints/CLIP_Feedback_Refinement_RowC
  training_states: /scratch/p24cs0203/krish/training_states/CLIP_Feedback_Refinement_RowC
  log: /scratch/p24cs0203/krish/logs/CLIP_Feedback_Refinement_RowC
  visualization: /scratch/p24cs0203/krish/outputs/CLIP_Feedback_Refinement_RowC/visualization
  tb_logger: /scratch/p24cs0203/krish/tb_logger/CLIP_Feedback_Refinement_RowC
  pretrain_network_g: /scratch/p24cs0203/krish/checkpoints/Row_C_MultiLabel_Finetune_CDD11/net_g_latest.pth
  param_key_g: params_ema
train:
  optim_g: {type: AdamW, lr: 1.0e-4, weight_decay: 0}
  scheduler: {type: CosineAnnealingRestartLR, periods: [50000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 50000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
val: {val_freq: 5000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 5000, use_tb_logger: true, wandb: {project: null}}
