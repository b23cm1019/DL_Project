# Stage 3 of the independent Proposed-Restormer arm.
# Two ranks x 16 patches preserve global B=32 CDD restoration exposure.
name: SeverityRestormer_Stage3_CDDRestore
model_type: FrozenFeatureConditionedRestorationModel
scale: 1
num_gpu: 2
manual_seed: 0
classify: false
find_unused_parameters: true

datasets:
  train:
    name: cdd11_restore_train
    type: SeverityDCPTPairedDataset
    source: cdd11
    phase: train
    manifest: /scratch/p26cs0003/krish/stage0_official_r4_improved/manifests/train.jsonl
    degradation_types: [low, haze, rain, snow]
    gt_size: 128
    use_hflip: true
    use_rot: true
  val:
    name: cdd11_restore_val
    type: SeverityDCPTPairedDataset
    source: cdd11
    phase: val
    manifest: /scratch/p26cs0003/krish/stage0_official_r4_improved/manifests/val.jsonl
    degradation_types: [low, haze, rain, snow]

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 16
  dataset_enlarge_ratio: 1
  pin_memory: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: FrozenFeatureConditionedRestormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false
  scale: 1
  window_size: 8
  condition_dim: 16
  adapter_dim: 128
network_extractor:
  type: FeatureSeverityExtractor
  feature_dims: [48, 96, 192]
  middle_dim: 384
  hidden_dim: 256
  num_types: 4
  num_bins: 4

stage3_trainable_parameter_prefixes: [condition_projector, latent_film, decoder_level3_film, decoder_level2_film, decoder_level1_film, refinement_film, up4_3, reduce_chan_level3, decoder_level3, up3_2, reduce_chan_level2, decoder_level2, up2_1, decoder_level1, refinement, output]

path:
  experiments_root: /scratch/p26cs0003/krish/experiments/SeverityRestormer_Stage3_CDDRestore
  pretrain_network_g: /scratch/p26cs0003/krish/experiments/SeverityRestormer_Stage2_CDDAdapt/models/net_g_latest.pth
  pretrain_network_extractor: /scratch/p26cs0003/krish/experiments/SeverityRestormer_Stage2_CDDAdapt/models/net_extractor_latest.pth
  param_key_g: params
  param_key_extractor: params
  strict_load_g: false
  strict_load_extractor: true
  resume_state: null

train:
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  scheduler: {type: CosineAnnealingRestartLR, periods: [750000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 750000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
val: {val_freq: 100000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 50000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29633}
