network_g:
  type: NAFNet
  width: 64
  enc_blk_nums:
  - 1
  - 1
  - 1
  - 28
  middle_blk_num: 1
  dec_blk_nums:
  - 1
  - 1
  - 1
  - 1
  window_size: 16
  prompt_dim: 4
path:
  pretrain_network_g: experiments/Row_D_Prompt_Finetune_CDD11/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: true
  pretrain_network_dc: experiments/Row_C_MultiLabel_Pretrain_CDD11/models/net_dc_latest.pth
  strict_load_dc: true
val:
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      image_range: 1.0
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
      image_range: 1.0
network_dc:
  type: PromptIR_NoImg_DC
  feature_dims:
  - 64
  - 128
  - 256
  - 512
  num_classes: 4
hook_names: decoder
