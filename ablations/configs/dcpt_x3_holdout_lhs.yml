# X3 baseline: DCPT fine-tuning with low_haze_snow held out of training (val keeps all 11).
# Generated by ablations/make_configs.py from dcpt_cdd11_finetune_750k.yml; 200k updates on its
# 750k cosine curve -> compare with DCPT's net_g_200000.pth and with Abl_X3_Holdout_LHS.
# Paper-faithful DCPT-NAFNet fine-tuning on all CDD-11 categories.
# Initialize only NAFNet (net_g) from the synthetic DCPT pretraining run.
name: DCPT_X3_Holdout_LHS
model_type: SRModel
scale: 1
num_gpu: 1
manual_seed: 0

datasets:
  # Explicit entries are intentional: the project's ordered YAML loader does
  # not implement YAML anchor merging.
  train_1:
    name: low
    type: PairedImageDataset
    dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear
    dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/low
    io_backend: {type: disk}
    gt_size: 128
    use_hflip: true
    use_rot: true
  train_2: {name: haze, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/haze, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_3: {name: rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_4: {name: snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_5: {name: low_haze, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/low_haze, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_6: {name: low_rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/low_rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_7: {name: low_snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/low_snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_8: {name: haze_rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/haze_rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_9: {name: haze_snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/haze_snow, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}
  train_10: {name: low_haze_rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/train/CDD-11_train/low_haze_rain, io_backend: {type: disk}, gt_size: 128, use_hflip: true, use_rot: true}

  val_1:
    name: low
    type: PairedImageDataset
    dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear
    dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/low
    io_backend: {type: disk}
  val_2: {name: haze, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/haze, io_backend: {type: disk}}
  val_3: {name: rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/rain, io_backend: {type: disk}}
  val_4: {name: snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/snow, io_backend: {type: disk}}
  val_5: {name: low_haze, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/low_haze, io_backend: {type: disk}}
  val_6: {name: low_rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/low_rain, io_backend: {type: disk}}
  val_7: {name: low_snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/low_snow, io_backend: {type: disk}}
  val_8: {name: haze_rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/haze_rain, io_backend: {type: disk}}
  val_9: {name: haze_snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/haze_snow, io_backend: {type: disk}}
  val_10: {name: low_haze_rain, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/low_haze_rain, io_backend: {type: disk}}
  val_11: {name: low_haze_snow, type: PairedImageDataset, dataroot_gt: @SHARED_ROOT@/datasets/CDD11/test/clear, dataroot_lq: @SHARED_ROOT@/datasets/CDD11/test/low_haze_snow, io_backend: {type: disk}}

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  # Match DCPT's reported 32-patch finetuning exposure.
  batch_size_per_gpu: 32
  dataset_enlarge_ratio: 1
  pin_memory: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16

path:
  experiments_root: @OUT_ROOT@/ablations/experiments/DCPT_X3_Holdout_LHS
  tb_logger: @OUT_ROOT@/ablations/tb_logger/DCPT_X3_Holdout_LHS
  pretrain_network_g: @SHARED_ROOT@/experiments/DCPT_NAFNet_LSDIR80k_Pretrain_100k/models/net_g_latest.pth
  # DCPTModel saves the pretraining generator under the standard params key.
  # params_ema is only emitted by SRModel fine-tuning, not DCPTModel.
  param_key_g: params
  strict_load_g: true
  resume_state: null

grad_clip: 0.01
train:
  ema_decay: 0.999
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  scheduler: {type: CosineAnnealingRestartLR, periods: [750000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 200000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
# Run costly full-resolution validation every 100k updates while retaining
# 50k recovery checkpoints for robust resume.
val: {val_freq: 100000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 50000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29500}
