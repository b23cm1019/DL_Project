# F1/F2: Does skip-FiLM help? (= placement middle+decoder)
# Generated by ablations/make_configs.py from portable/nafnet_planb_full750k.yml (Plan B).
# Only change vs Plan B: film_sites: [middle, decoder]
# Budget: 100k SCREENING updates on Plan B's 750k cosine curve -> compare with Plan B's and DCPT's
# net_g_100000.pth. Checkpoints every 10k (a 12 h job limit loses at most 10k on resume).
name: Abl_F1_NoSkipFiLM_100k
model_type: SeverityFullFinetuneModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
find_unused_parameters: false

# Read by the ablation scripts (eval / cache / probes); ignored by the trainer.
ablation:
  id: F1/F2
  question: "Does skip-FiLM help? (= placement middle+decoder)"
  analysis:
    generator: @SHARED_ROOT@/experiments/SeverityDCPT_Stage2_CDDAdapt/models/net_g_latest.pth
    extractor: @SHARED_ROOT@/experiments/SeverityDCPT_Stage2_CDDAdapt/models/net_extractor_latest.pth

datasets:
  train:
    name: cdd11_full_train
    type: SeverityConditionedPairedDataset
    manifest: @SHARED_ROOT@/severity_full/manifests/train_full.jsonl
    gt_size: 128
    use_hflip: true
    use_rot: true
  val:
    name: cdd11_test_subset
    type: SeverityConditionedPairedDataset
    manifest: @SHARED_ROOT@/severity_full/manifests/val_subset.jsonl

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 32
  dataset_enlarge_ratio: 1
  pin_memory: true
  persistent_workers: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: AblationFullNAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16
  num_types: 4
  num_bins: 4
  adapter_dim: 128
  condition_mode: full
  use_gate: true
  use_calibrator: true
  film_sites: [middle, decoder]

path:
  experiments_root: @OUT_ROOT@/ablations/experiments/Abl_F1_NoSkipFiLM_100k
  tb_logger: @OUT_ROOT@/ablations/tb_logger/Abl_F1_NoSkipFiLM_100k
  pretrain_network_g: @SHARED_ROOT@/experiments/SeverityDCPT_Stage2_CDDAdapt/models/net_g_latest.pth
  param_key_g: params
  strict_load_g: false
  resume_state: null

grad_clip: 0.01
train:
  ema_decay: 0.999
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  condition_lr_mult: 1.0
  encoder_lr_mult: 1.0
  scheduler: {type: CosineAnnealingRestartLR, periods: [750000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 100000
  warmup_iter: -1
  fft_loss_weight: 0.0
  kl_loss_weight: 0.01
  condition_dropout: 0.0
  condition_dropout_warmup: 0
val: {val_freq: 50000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 10000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29700}
