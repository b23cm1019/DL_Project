# S5 Stage 1: Ordinal vs categorical severity head
# Generated by ablations/make_configs.py from severity_dcpt_stage1_synthetic.yml.
# Only change: severity loss = cross-entropy over bins 1-3 (no order)
# Micro-batch 16 x 2 accumulation = the original batch 32 exactly (LayerNorm only); fits a 24 GB A30.
name: Abl_S5_Categorical_Stage1
model_type: AblationSeverityPretrainModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false

ablation:
  id: S5
  question: "Ordinal vs categorical severity head"

datasets:
  train:
    name: synthetic_severity_train
    type: SeverityDCPTPairedDataset
    source: synthetic
    phase: train
    manifest: @SHARED_ROOT@/severity_cdd11_lsdir_outdoor_v1/data/manifests/train.jsonl
    degradation_types: [low, haze, rain, snow]
    gt_size: 128
    use_hflip: true
    use_rot: true
  val:
    name: synthetic_severity_val
    type: SeverityDCPTPairedDataset
    source: synthetic
    phase: val
    manifest: @SHARED_ROOT@/severity_cdd11_lsdir_outdoor_v1/data/manifests/val.jsonl
    degradation_types: [low, haze, rain, snow]

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 16
  dataset_enlarge_ratio: 1
  sampler_type: composition_balanced
  pin_memory: true
  persistent_workers: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16
network_extractor:
  type: AblationSeverityExtractor
  feature_dims: [64, 128, 256, 512]
  middle_dim: 1024
  hidden_dim: 256
  num_types: 4
  num_bins: 4

path:
  experiments_root: @OUT_ROOT@/ablations/experiments/Abl_S5_Categorical_Stage1
  tb_logger: @OUT_ROOT@/ablations/tb_logger/Abl_S5_Categorical_Stage1
  pretrain_network_g: null
  pretrain_network_extractor: null
  strict_load_g: true
  strict_load_extractor: true
  resume_state: null

train:
  accumulation_steps: 2
  optim_g: {type: AdamW, lr: 3.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  optim_extractor: {type: AdamW, lr: 1.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  scheduler: {type: ConstantLR}
  total_iter: 100000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
  identity_loss_weight: 1.0
  severity_loss_weight: 1.0
  type_loss_weight: 0.25
  severity_loss: categorical
val: {val_freq: 25000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 10000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29701}
