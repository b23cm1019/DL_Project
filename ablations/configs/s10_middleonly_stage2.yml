# S10 Stage 2: Do multi-level features help the analyzer?
# Generated by ablations/make_configs.py from severity_dcpt_stage2_cdd_adapt.yml.
# Only change: extractor reads only the middle (bottleneck) feature
name: Abl_S10_MiddleOnly_Stage2
model_type: AblationSeverityAdaptationModel
scale: 1
num_gpu: 1
manual_seed: 0
classify: false
find_unused_parameters: true

ablation:
  id: S10
  question: "Do multi-level features help the analyzer?"

datasets:
  train_synthetic:
    name: synthetic_severity_replay
    type: SeverityDCPTPairedDataset
    source: synthetic
    phase: train
    manifest: @SHARED_ROOT@/severity_cdd11_lsdir_outdoor_v1/data/manifests/train.jsonl
    degradation_types: [low, haze, rain, snow]
    gt_size: 128
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1
  train_cdd:
    name: cdd11_type_adaptation
    type: SeverityDCPTPairedDataset
    source: cdd11
    phase: train
    manifest: @SHARED_ROOT@/stage0_official_r4_improved/manifests/train.jsonl
    degradation_types: [low, haze, rain, snow]
    gt_size: 128
    use_hflip: true
    use_rot: true
    dataset_enlarge_ratio: 1
  val_synthetic:
    name: synthetic_severity_val
    type: SeverityDCPTPairedDataset
    source: synthetic
    phase: val
    manifest: @SHARED_ROOT@/severity_cdd11_lsdir_outdoor_v1/data/manifests/val.jsonl
    degradation_types: [low, haze, rain, snow]
  val_cdd:
    name: cdd11_type_val
    type: SeverityDCPTPairedDataset
    source: cdd11
    phase: val
    manifest: @SHARED_ROOT@/stage0_official_r4_improved/manifests/val.jsonl
    degradation_types: [low, haze, rain, snow]

dataloader:
  phase: train
  use_shuffle: true
  num_worker_per_gpu: 8
  batch_size_per_gpu: 16
  dataset_enlarge_ratio: 1
  sampler_type: fixed_mixed_sources
  cdd_per_batch: 8
  synthetic_per_batch: 8
  pin_memory: true
dataloader_val:
  phase: val
  use_shuffle: false
  num_worker_per_gpu: 4
  batch_size_per_gpu: 1
  pin_memory: true

network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]
  window_size: 16
network_extractor:
  type: AblationSeverityExtractor
  feature_dims: [64, 128, 256, 512]
  middle_dim: 1024
  hidden_dim: 256
  num_types: 4
  num_bins: 4
  use_levels: [4]

path:
  experiments_root: @OUT_ROOT@/ablations/experiments/Abl_S10_MiddleOnly_Stage2
  tb_logger: @OUT_ROOT@/ablations/tb_logger/Abl_S10_MiddleOnly_Stage2
  pretrain_network_g: @OUT_ROOT@/ablations/experiments/Abl_S10_MiddleOnly_Stage1/models/net_g_latest.pth
  pretrain_network_extractor: @OUT_ROOT@/ablations/experiments/Abl_S10_MiddleOnly_Stage1/models/net_extractor_latest.pth
  param_key_g: params
  param_key_extractor: params
  strict_load_g: true
  strict_load_extractor: true
  resume_state: null

train:
  optim_g: {type: AdamW, lr: 3.0e-5, weight_decay: 0, betas: [0.9, 0.999]}
  optim_extractor: {type: AdamW, lr: 1.0e-4, weight_decay: 0, betas: [0.9, 0.999]}
  scheduler: {type: CosineAnnealingRestartLR, periods: [50000], restart_weights: [1], eta_min: 1.0e-6}
  total_iter: 50000
  warmup_iter: -1
  pixel_opt: {type: L1Loss, loss_weight: 1.0, reduction: mean}
  identity_loss_weight: 1.0
  replay_severity_loss_weight: 1.0
  type_loss_weight: 1.0
  severity_loss: ordinal
val: {val_freq: 10000, save_img: false}
logger: {print_freq: 100, save_checkpoint_freq: 10000, use_tb_logger: true, wandb: {project: null}}
dist_params: {backend: nccl, port: 29702}
